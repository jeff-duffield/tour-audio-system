<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EF Tour Audio - Welcome</title>
    <link rel="icon" type="image/png" href="EF-Logos_EF Logo Pink.png">
    <style>
        html { background: #00243C; }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'EF Circular', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(180deg, #003C64 0%, #00243C 100%);
            min-height: 100dvh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 48px 24px;
        }
        .page {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            width: 100%;
            max-width: 420px;
        }
        .logo {
            height: 60px;
            margin-bottom: 32px;
            filter: drop-shadow(0 4px 16px rgba(0,0,0,0.3));
        }
        h1 {
            color: #fff;
            font-size: 34px;
            font-weight: 700;
            letter-spacing: -0.5px;
            margin-bottom: 8px;
        }
        .subtitle {
            color: rgba(255,255,255,0.6);
            font-size: 17px;
            font-weight: 400;
            margin-bottom: 40px;
        }
        .continue-btn {
            display: block;
            width: 100%;
            background: #FF329B;
            color: #fff;
            padding: 16px;
            border-radius: 50px;
            text-decoration: none;
            font-size: 17px;
            font-weight: 700;
            transition: all 0.2s ease;
        }
        .continue-btn:hover {
            background: #e0237f;
            transform: translateY(-1px);
            box-shadow: 0 8px 24px rgba(255,50,155,0.35);
        }
        .continue-btn:active { transform: translateY(0); box-shadow: none; }
        /* Easter egg tap dots */
        .tap-dots {
            display: flex;
            gap: 6px;
            position: absolute;
            top: 8px;
            left: 50%;
            transform: translateX(-50%);
            opacity: 0;
            transition: opacity 0.2s ease;
        }
        .tap-dots.visible { opacity: 1; }
        .tap-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: rgba(255,255,255,0.25);
            transition: background 0.15s ease;
        }
        .tap-dot.lit { background: #FF329B; }
        .logo-wrap {
            position: relative;
            display: inline-flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 32px;
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }
        .logo-wrap .logo { margin-bottom: 0; }
        /* Entrance animations */
        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(16px); }
            to   { opacity: 1; transform: translateY(0); }
        }
        .anim-0 { animation: fadeUp 0.5s ease both; }
        .anim-1 { animation: fadeUp 0.5s ease both; animation-delay:  80ms; }
        .anim-2 { animation: fadeUp 0.5s ease both; animation-delay: 160ms; }
    </style>
</head>
<body>
    <div class="page">
        <div class="logo-wrap anim-0" id="logoWrap" aria-hidden="true">
            <div class="tap-dots" id="tapDots">
                <div class="tap-dot" id="d1"></div>
                <div class="tap-dot" id="d2"></div>
                <div class="tap-dot" id="d3"></div>
                <div class="tap-dot" id="d4"></div>
                <div class="tap-dot" id="d5"></div>
            </div>
            <img src="EF-Logos_EF Logo Pink.png" alt="EF Tours" class="logo">
        </div>
        <h1 class="anim-1">Tour Audio</h1>
        <p class="subtitle anim-1">Listen to your guide in real-time</p>
        <a href="https://audio.eftours.travel/index.html" class="continue-btn anim-2">
            Start Listening
        </a>
    </div>
    <script>
        (function () {
            var count = 0, timer = null;
            var wrap = document.getElementById('logoWrap');
            var dots = document.getElementById('tapDots');
            var dotEls = [
                document.getElementById('d1'), document.getElementById('d2'),
                document.getElementById('d3'), document.getElementById('d4'),
                document.getElementById('d5')
            ];

            function reset() {
                count = 0;
                dots.classList.remove('visible');
                dotEls.forEach(function (d) { d.classList.remove('lit'); });
                clearTimeout(timer);
            }

            wrap.addEventListener('click', function () {
                count++;
                clearTimeout(timer);
                dots.classList.add('visible');
                for (var i = 0; i < dotEls.length; i++) {
                    dotEls[i].classList.toggle('lit', i < count);
                }
                if (count >= 5) {
                    reset();
                    window.location.href = 'https://audio.eftours.travel/guide.html';
                    return;
                }
                timer = setTimeout(reset, 3000);
            });
        })();
    </script>
</body>
</html>
