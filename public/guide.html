<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EF Tour Audio - Guide</title>
    <link rel="icon" type="image/png" href="EF-Logos_EF Logo Pink.png">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', sans-serif;
            background: linear-gradient(135deg, #FF69B4 0%, #FF1493 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .container {
            background: #FFFFFF;
            border-radius: 20px;
            padding: 32px 40px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 560px;
            width: 100%;
        }
        h1 {
            color: #003C64;
            margin-bottom: 8px;
            font-size: 32px;
            font-weight: 700;
            letter-spacing: -0.5px;
        }
        .subtitle {
            color: #666;
            margin-bottom: 32px;
            font-size: 18px;
            font-weight: 400;
        }
        .status {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 24px;
            padding: 16px;
            background: #E3EBED;
            border-radius: 12px;
        }
        .status-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #EFEFEF;
        }
        .status-dot.broadcasting { background: #009EEB; animation: pulse 1.5s infinite; }
        .status-dot.connected { background: #009EEB; }
        .status-dot.error { background: #FF329B; }
        @keyframes pulse {
            0%, 100% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.3); opacity: 0.6; }
        }
        .status-text {
            font-weight: 600;
            color: #191919;
            font-size: 15px;
        }
        .visualizer {
            height: 100px;
            background: #E3F7FF;
            border-radius: 12px;
            margin-bottom: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 4px;
            padding: 16px;
        }
        .bar {
            width: 5px;
            background: #009EEB;
            border-radius: 3px;
            transition: height 0.1s ease;
        }
        button {
            width: 100%;
            padding: 18px;
            font-size: 17px;
            font-weight: 700;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.2s ease;
            margin-bottom: 12px;
        }
        .broadcast-btn {
            background: #009EEB;
            color: #FFFFFF;
        }
        .broadcast-btn:hover {
            background: #0088CC;
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(0, 158, 235, 0.3);
        }
        .broadcast-btn:active { transform: translateY(0); }
        .stop-btn {
            background: #003C64;
            color: #FFFFFF;
        }
        .stop-btn:hover {
            background: #002A47;
        }
        .test-btn {
            background: #FFFFFF;
            color: #009EEB;
            border: 2px solid #009EEB;
            padding: 16px;
            font-size: 15px;
        }
        .test-btn:hover {
            background: #E3F7FF;
            transform: translateY(-1px);
        }
        .test-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }
        .test-status {
            text-align: center;
            margin-top: 12px;
            font-size: 14px;
            color: #003C64;
            min-height: 20px;
            font-weight: 500;
        }
        .broadcast-indicator {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 8px 16px;
            background: #FFE8F5;
            border-radius: 8px;
            margin-bottom: 16px;
            font-size: 14px;
            color: #C2185B;
            font-weight: 500;
        }
        .broadcast-indicator .pulse-dot {
            width: 10px;
            height: 10px;
            background: #FF1493;
            border-radius: 50%;
            animation: pulse 1.5s ease-in-out infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.5; transform: scale(1.2); }
        }
        .listener-counter {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 16px;
            background: linear-gradient(135deg, #E3F7FF 0%, #E3EBED 100%);
            border-radius: 12px;
            margin-bottom: 16px;
            border: 2px solid #009EEB;
        }
        .counter-text {
            display: flex;
            align-items: baseline;
            gap: 8px;
        }
        .counter-number {
            font-size: 28px;
            font-weight: 700;
            color: #003C64;
            line-height: 1;
        }
        .counter-label {
            font-size: 12px;
            font-weight: 600;
            color: #666;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
    </style>
</head>
<body>
    <div class="container">
        <img src="EF-Logos_EF Logo Pink.png" alt="EF Tours" style="height: 60px; margin-bottom: 8px;">
        <h1>Tour Guide</h1>
        <p class="subtitle">Broadcast to your group</p>

        <!-- Broadcast indicator (shown when broadcasting) -->
        <div id="broadcastIndicator" class="broadcast-indicator" style="display: none;">
            <div class="pulse-dot"></div>
            <span>🎙️ Broadcasting</span>
        </div>

        <!-- Listener counter -->
        <div class="listener-counter" id="listenerCounter">
            <div class="counter-text">
                <div class="counter-number" id="listenerCount">0</div>
                <div class="counter-label">Listeners</div>
            </div>
        </div>

        <div class="status">
            <div class="status-dot" id="statusDot"></div>
            <div class="status-text" id="statusText">Ready to broadcast</div>
        </div>

        <div class="visualizer" id="visualizer">
            <div class="bar"></div><div class="bar"></div><div class="bar"></div>
            <div class="bar"></div><div class="bar"></div><div class="bar"></div>
            <div class="bar"></div><div class="bar"></div><div class="bar"></div>
            <div class="bar"></div><div class="bar"></div><div class="bar"></div>
            <div class="bar"></div><div class="bar"></div><div class="bar"></div>
            <div class="bar"></div><div class="bar"></div><div class="bar"></div>
        </div>

        <button id="toggleBtn" class="broadcast-btn" onclick="toggleBroadcast()">
            Start Broadcasting
        </button>

        <button id="testBtn" class="test-btn" onclick="testMicrophone()">
            🎤 Test Microphone
        </button>

        <div class="test-status" id="testStatus"></div>
    </div>

    <script>
        let ws = null;
        let isStreaming = false;
        let audioContext = null;
        let analyser = null;
        let scriptProcessor = null;
        let stream = null;
        let wakeLock = null;

        // Request wake lock to prevent screen from sleeping during broadcast
        async function requestWakeLock() {
            try {
                if ('wakeLock' in navigator) {
                    wakeLock = await navigator.wakeLock.request('screen');
                    console.log('Wake Lock acquired - screen will stay on during broadcast');

                    // Re-acquire wake lock if it's released (e.g., user switches tabs)
                    wakeLock.addEventListener('release', () => {
                        console.log('Wake Lock released');
                    });
                } else {
                    console.log('Wake Lock API not supported on this device');
                }
            } catch (err) {
                console.error('Failed to acquire Wake Lock:', err);
            }
        }

        // Release wake lock
        async function releaseWakeLock() {
            if (wakeLock !== null) {
                try {
                    await wakeLock.release();
                    wakeLock = null;
                    console.log('Wake Lock released - screen can sleep now');
                } catch (err) {
                    console.error('Failed to release Wake Lock:', err);
                }
            }
        }

        function updateUI() {
            const btn = document.getElementById('toggleBtn');
            const statusText = document.getElementById('statusText');
            const statusDot = document.getElementById('statusDot');

            if (isStreaming) {
                btn.textContent = 'Stop Broadcasting';
                btn.className = 'stop-btn';
                statusText.textContent = 'Broadcasting live';
                statusDot.className = 'status-dot broadcasting';
            } else {
                btn.textContent = 'Start Broadcasting';
                btn.className = 'broadcast-btn';
                statusText.textContent = 'Ready to broadcast';
                statusDot.className = 'status-dot';
            }
        }

        function updateListenerCount(count) {
            // Subtract 1 to exclude the guide from the count
            const listenerCount = Math.max(0, count - 1);
            const countElement = document.getElementById('listenerCount');
            const labelElement = document.querySelector('.counter-label');

            countElement.textContent = listenerCount;
            labelElement.textContent = listenerCount === 1 ? 'Listener' : 'Listeners';

            console.log('Listener count updated:', listenerCount);
        }

        function updateVisualizer() {
            if (!analyser || !isStreaming) return;

            const dataArray = new Uint8Array(analyser.frequencyBinCount);
            analyser.getByteTimeDomainData(dataArray);  // Changed to time domain for better responsiveness

            const bars = document.querySelectorAll('.bar');

            // Calculate average amplitude
            let sum = 0;
            for (let i = 0; i < dataArray.length; i++) {
                sum += Math.abs(dataArray[i] - 128);
            }
            const average = sum / dataArray.length;

            // Update bars with some variation
            bars.forEach((bar, i) => {
                const offset = Math.sin(Date.now() / 200 + i) * 10;
                const value = dataArray[i * 3] || 128;
                const amplitude = Math.abs(value - 128);
                const height = Math.max(5, (amplitude / 128) * 50 + offset + (average / 2));
                bar.style.height = height + 'px';
            });

            requestAnimationFrame(updateVisualizer);
        }

        async function startBroadcast() {
            try {
                stream = await navigator.mediaDevices.getUserMedia({
                    audio: {
                        echoCancellation: true,
                        noiseSuppression: true,
                        autoGainControl: true
                    }
                });

                console.log('Microphone stream obtained:', stream);
                console.log('Audio tracks:', stream.getAudioTracks());

                // Create AudioContext for visualizer only
                audioContext = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: 16000 });
                console.log('AudioContext created, state:', audioContext.state);

                // Resume AudioContext if suspended
                if (audioContext.state === 'suspended') {
                    await audioContext.resume();
                    console.log('AudioContext resumed, new state:', audioContext.state);
                }

                // Create analyser for visualizer
                analyser = audioContext.createAnalyser();
                analyser.fftSize = 256;
                analyser.smoothingTimeConstant = 0.3;

                const source = audioContext.createMediaStreamSource(stream);
                source.connect(analyser);
                // Don't connect analyser to destination - it's only for visualization

                console.log('Analyser connected, starting visualizer');

                // Create script processor for audio streaming
                // Using 1024 samples for stable, continuous audio
                scriptProcessor = audioContext.createScriptProcessor(1024, 1, 1);
                source.connect(scriptProcessor);

                // Create a gain node set to 0 to prevent feedback while keeping scriptProcessor active
                const silentGain = audioContext.createGain();
                silentGain.gain.value = 0; // Mute the output
                scriptProcessor.connect(silentGain);
                silentGain.connect(audioContext.destination);

                console.log('ScriptProcessor created (1024 samples = 64ms latency)');

                const protocol = location.protocol === 'https:' ? 'wss:' : 'ws:';
                ws = new WebSocket(protocol + '//' + location.host);
                ws.binaryType = 'arraybuffer';

                console.log('WebSocket connecting to:', protocol + '//' + location.host);

                let audioPacketCount = 0;
                let droppedPackets = 0;

                ws.onopen = async () => {
                    console.log('WebSocket connected!');

                    scriptProcessor.onaudioprocess = (e) => {
                        if (ws && ws.readyState === WebSocket.OPEN) {
                            const inputData = e.inputBuffer.getChannelData(0);

                            // Optimized PCM encoding - convert Float32 to Int16
                            const pcmData = new Int16Array(inputData.length);
                            for (let i = 0; i < inputData.length; i++) {
                                const s = Math.max(-1, Math.min(1, inputData[i]));
                                pcmData[i] = s < 0 ? s * 32768 : s * 32767;
                            }

                            // Send PCM data - ALWAYS send, no backpressure check
                            // (backpressure will be handled on server side)
                            ws.send(pcmData.buffer);

                            // Log every 100th packet
                            audioPacketCount++;
                            if (audioPacketCount % 100 === 0) {
                                console.log('Sent packet #' + audioPacketCount + ', buffer: ' + ws.bufferedAmount + ' bytes');
                            }
                        }
                    };

                    isStreaming = true;
                    updateUI();

                    // Request wake lock to keep screen on during broadcast
                    await requestWakeLock();

                    // Show broadcast indicator
                    document.getElementById('broadcastIndicator').style.display = 'inline-flex';

                    // Start visualizer after streaming is set to true
                    updateVisualizer();

                    console.log('Broadcasting started');
                };

                ws.onmessage = (event) => {
                    // Handle client count updates from server
                    try {
                        const message = JSON.parse(event.data);
                        if (message.type === 'client-count') {
                            updateListenerCount(message.count);
                        }
                    } catch (e) {
                        // Not JSON, ignore (might be audio data echo, but guide shouldn't receive audio)
                    }
                };

                ws.onerror = () => {
                    document.getElementById('statusText').textContent = 'Connection error';
                    document.getElementById('statusDot').className = 'status-dot error';
                };

                ws.onclose = () => {
                    if (isStreaming) {
                        stopBroadcast();
                    }
                };
                
            } catch (err) {
                alert('Could not access microphone: ' + err.message);
            }
        }

        function stopBroadcast() {
            if (scriptProcessor) {
                scriptProcessor.disconnect();
                scriptProcessor = null;
            }
            if (ws) {
                ws.close();
                ws = null;
            }
            if (stream) {
                stream.getTracks().forEach(track => track.stop());
                stream = null;
            }
            if (audioContext) {
                audioContext.close();
                audioContext = null;
            }

            isStreaming = false;
            updateUI();

            // Release wake lock when stopping broadcast
            releaseWakeLock();

            // Hide broadcast indicator
            document.getElementById('broadcastIndicator').style.display = 'none';

            const bars = document.querySelectorAll('.bar');
            bars.forEach(bar => bar.style.height = '5px');
        }

        function toggleBroadcast() {
            if (isStreaming) {
                stopBroadcast();
            } else {
                startBroadcast();
            }
        }

        // Microphone test functionality - iOS/Safari compatible
        let testRecorder = null;
        let testChunks = [];
        let testAudioContext = null;
        let testRecordedBuffers = [];

        async function testMicrophone() {
            const testBtn = document.getElementById('testBtn');
            const testStatus = document.getElementById('testStatus');

            try {
                testBtn.disabled = true;
                testStatus.textContent = 'Accessing microphone...';

                // Get microphone access
                const testStream = await navigator.mediaDevices.getUserMedia({
                    audio: {
                        echoCancellation: true,
                        noiseSuppression: true,
                        autoGainControl: true
                    }
                });

                testStatus.textContent = 'Recording 3 seconds...';

                // Use Web Audio API for iOS compatibility (MediaRecorder not fully supported)
                testAudioContext = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: 16000 });

                // Resume if suspended
                if (testAudioContext.state === 'suspended') {
                    await testAudioContext.resume();
                }

                const source = testAudioContext.createMediaStreamSource(testStream);
                const processor = testAudioContext.createScriptProcessor(4096, 1, 1);

                testRecordedBuffers = [];

                processor.onaudioprocess = (e) => {
                    // Store audio data
                    const inputData = e.inputBuffer.getChannelData(0);
                    const buffer = new Float32Array(inputData.length);
                    buffer.set(inputData);
                    testRecordedBuffers.push(buffer);
                };

                source.connect(processor);
                processor.connect(testAudioContext.destination);

                // Record for 3 seconds
                setTimeout(() => {
                    processor.disconnect();
                    source.disconnect();
                    testStream.getTracks().forEach(track => track.stop());

                    // Play back the recorded audio
                    playbackRecording();
                }, 3000);

            } catch (err) {
                testStatus.textContent = 'Error: ' + err.message;
                testBtn.disabled = false;
                console.error('Microphone test error:', err);
            }
        }

        function playbackRecording() {
            const testBtn = document.getElementById('testBtn');
            const testStatus = document.getElementById('testStatus');

            try {
                testStatus.textContent = 'Playing back...';

                if (testRecordedBuffers.length === 0) {
                    testStatus.textContent = 'No audio recorded';
                    testBtn.disabled = false;
                    return;
                }

                // Combine all buffers
                const totalLength = testRecordedBuffers.reduce((acc, buf) => acc + buf.length, 0);
                const combinedBuffer = new Float32Array(totalLength);
                let offset = 0;
                for (const buffer of testRecordedBuffers) {
                    combinedBuffer.set(buffer, offset);
                    offset += buffer.length;
                }

                // Create audio buffer for playback
                const audioBuffer = testAudioContext.createBuffer(1, combinedBuffer.length, testAudioContext.sampleRate);
                audioBuffer.getChannelData(0).set(combinedBuffer);

                // Play it back
                const source = testAudioContext.createBufferSource();
                source.buffer = audioBuffer;
                source.connect(testAudioContext.destination);

                source.onended = () => {
                    testStatus.textContent = 'Test complete! ✓';
                    testBtn.disabled = false;
                    testAudioContext.close();
                    testAudioContext = null;
                    testRecordedBuffers = [];

                    setTimeout(() => {
                        testStatus.textContent = '';
                    }, 3000);
                };

                source.start(0);

            } catch (err) {
                testStatus.textContent = 'Playback error: ' + err.message;
                testBtn.disabled = false;
                console.error('Playback error:', err);
            }
        }
    </script>
</body>
</html>
