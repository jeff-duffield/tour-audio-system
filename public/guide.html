<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EF Tour Audio - Guide</title>
    <link rel="icon" type="image/png" href="EF-Logos_EF Logo Pink.png">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', sans-serif;
            background: linear-gradient(135deg, #FF69B4 0%, #FF1493 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .container {
            background: #FFFFFF;
            border-radius: 20px;
            padding: 32px 40px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 560px;
            width: 100%;
        }
        .header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 8px;
        }
        .logo {
            height: 60px;
            flex-shrink: 0;
        }
        h1 {
            color: #003C64;
            margin: 0;
            font-size: 32px;
            font-weight: 700;
            letter-spacing: -0.5px;
        }
        .subtitle {
            color: #666;
            margin-bottom: 32px;
            font-size: 18px;
            font-weight: 400;
        }
        .status {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 24px;
            padding: 16px;
            background: #E3EBED;
            border-radius: 12px;
        }
        .status-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #EFEFEF;
        }
        .status-dot.broadcasting { background: #009EEB; animation: pulse 1.5s infinite; }
        .status-dot.connected { background: #009EEB; }
        .status-dot.error { background: #FF329B; }
        @keyframes pulse {
            0%, 100% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.3); opacity: 0.6; }
        }
        .status-text {
            font-weight: 600;
            color: #191919;
            font-size: 15px;
        }
        .visualizer {
            height: 50px;
            background: #E3F7FF;
            border-radius: 12px;
            margin-bottom: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 4px;
            padding: 16px;
        }
        .bar {
            width: 5px;
            background: #009EEB;
            border-radius: 3px;
            transition: height 0.1s ease;
        }
        button {
            width: 100%;
            padding: 18px;
            font-size: 17px;
            font-weight: 700;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.2s ease;
            margin-bottom: 12px;
        }
        .broadcast-btn {
            background: #009EEB;
            color: #FFFFFF;
        }
        .broadcast-btn:hover {
            background: #0088CC;
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(0, 158, 235, 0.3);
        }
        .broadcast-btn:active { transform: translateY(0); }
        .stop-btn {
            background: #003C64;
            color: #FFFFFF;
        }
        .stop-btn:hover {
            background: #002A47;
        }
        .test-btn {
            background: #FFFFFF;
            color: #009EEB;
            border: 2px solid #009EEB;
            padding: 16px;
            font-size: 15px;
        }
        .test-btn:hover {
            background: #E3F7FF;
            transform: translateY(-1px);
        }
        .test-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }
        .test-status {
            text-align: center;
            margin-top: 12px;
            font-size: 14px;
            color: #003C64;
            min-height: 20px;
            font-weight: 500;
        }
        .listener-counter {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 16px;
            background: linear-gradient(135deg, #E3F7FF 0%, #E3EBED 100%);
            border-radius: 12px;
            margin-bottom: 16px;
            border: 2px solid #009EEB;
        }
        .counter-text {
            display: flex;
            align-items: baseline;
            gap: 8px;
        }
        .counter-number {
            font-size: 28px;
            font-weight: 700;
            color: #003C64;
            line-height: 1;
        }
        .counter-label {
            font-size: 12px;
            font-weight: 600;
            color: #666;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .metrics-section {
            margin-top: 16px;
            border-top: 1px solid #EFEFEF;
            padding-top: 12px;
        }
        .metrics-toggle {
            width: 100%;
            background: none;
            border: none;
            padding: 8px 0;
            text-align: left;
            font-size: 14px;
            font-weight: 600;
            color: #666;
            cursor: pointer;
            margin-bottom: 0;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .metrics-toggle:hover { color: #003C64; }
        .metrics-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            margin-top: 10px;
        }
        .metric-item {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 12px;
            background: #F5F5F5;
            border-radius: 8px;
        }
        .metric-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #EFEFEF;
            flex-shrink: 0;
        }
        .metric-label {
            font-size: 12px;
            color: #666;
            font-weight: 500;
            flex: 1;
        }
        .metric-value {
            font-size: 13px;
            font-weight: 700;
            color: #003C64;
        }
        .metrics-updated {
            text-align: center;
            font-size: 11px;
            color: #999;
            margin-top: 8px;
        }
        /* Watch mode */
        .watch-banner {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 14px 16px;
            background: #FFF3E0;
            border: 2px solid #FF9800;
            border-radius: 12px;
            margin-bottom: 16px;
        }
        .watch-banner.ended {
            background: #E8F5E9;
            border-color: #4CAF50;
        }
        .watch-banner-icon { font-size: 24px; }
        .watch-banner-title {
            font-weight: 700;
            color: #003C64;
            font-size: 15px;
        }
        .watch-banner-sub {
            font-size: 13px;
            color: #666;
            margin-top: 2px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <img src="EF-Logos_EF Logo Pink.png" alt="EF Tours" class="logo">
            <h1>Tour Guide</h1>
        </div>
        <p class="subtitle">Broadcast to your group</p>

        <!-- Listener counter -->
        <div class="listener-counter" id="listenerCounter">
            <div class="counter-text">
                <div class="counter-number" id="listenerCount">0</div>
                <div class="counter-label">Listeners</div>
            </div>
        </div>

        <!-- Watch mode: another guide is broadcasting -->
        <div class="watch-banner" id="watchBanner" style="display:none;">
            <span class="watch-banner-icon">📡</span>
            <div>
                <div class="watch-banner-title">Another guide is broadcasting</div>
                <div class="watch-banner-sub">You are in watch-only mode</div>
            </div>
        </div>

        <!-- Watch mode: broadcaster stopped, offer takeover -->
        <div class="watch-banner ended" id="broadcastEndedBanner" style="display:none;">
            <span class="watch-banner-icon">⏹️</span>
            <div>
                <div class="watch-banner-title">Broadcast has ended</div>
                <div class="watch-banner-sub">You can now start broadcasting</div>
            </div>
        </div>

        <div class="status">
            <div class="status-dot" id="statusDot"></div>
            <div class="status-text" id="statusText">Ready to broadcast</div>
        </div>

        <div class="visualizer" id="visualizer">
            <div class="bar"></div><div class="bar"></div><div class="bar"></div>
            <div class="bar"></div><div class="bar"></div><div class="bar"></div>
            <div class="bar"></div><div class="bar"></div><div class="bar"></div>
            <div class="bar"></div><div class="bar"></div><div class="bar"></div>
            <div class="bar"></div><div class="bar"></div><div class="bar"></div>
            <div class="bar"></div><div class="bar"></div><div class="bar"></div>
        </div>

        <button id="toggleBtn" class="broadcast-btn" onclick="toggleBroadcast()">
            Start Broadcasting
        </button>

        <button id="testBtn" class="test-btn" onclick="testMicrophone()">
            🎤 Test Microphone
        </button>

        <div class="test-status" id="testStatus"></div>

        <!-- Performance metrics (collapsible) -->
        <div class="metrics-section">
            <button class="metrics-toggle" onclick="toggleMetrics()">
                <span id="metricsArrow">▶</span> Performance Metrics
            </button>
            <div id="metricsPanel" style="display: none;">
                <div class="metrics-grid">
                    <div class="metric-item">
                        <span class="metric-dot" id="dotCpu"></span>
                        <span class="metric-label">CPU</span>
                        <span class="metric-value" id="metricCpu">—</span>
                    </div>
                    <div class="metric-item">
                        <span class="metric-dot" id="dotRam"></span>
                        <span class="metric-label">RAM Free</span>
                        <span class="metric-value" id="metricRam">—</span>
                    </div>
                    <div class="metric-item">
                        <span class="metric-dot" id="dotThroughput"></span>
                        <span class="metric-label">Throughput</span>
                        <span class="metric-value" id="metricThroughput">—</span>
                    </div>
                    <div class="metric-item">
                        <span class="metric-dot" id="dotSkip"></span>
                        <span class="metric-label">Skip Rate</span>
                        <span class="metric-value" id="metricSkip">—</span>
                    </div>
                    <div class="metric-item">
                        <span class="metric-dot" id="dotClients"></span>
                        <span class="metric-label">Peak Clients</span>
                        <span class="metric-value" id="metricClients">—</span>
                    </div>
                    <div class="metric-item">
                        <span class="metric-dot" id="dotHeap"></span>
                        <span class="metric-label">Node Heap</span>
                        <span class="metric-value" id="metricHeap">—</span>
                    </div>
                </div>
                <div class="metrics-updated" id="metricsUpdated">Tap to refresh</div>
            </div>
        </div>
    </div>

    <script>
        let ws = null;
        let isStreaming = false;
        let isWatchMode = false;
        let audioContext = null;
        let analyser = null;
        let scriptProcessor = null;
        let stream = null;
        let wakeLock = null;

        // Request wake lock to prevent screen from sleeping during broadcast
        async function requestWakeLock() {
            try {
                if ('wakeLock' in navigator) {
                    wakeLock = await navigator.wakeLock.request('screen');
                    console.log('Wake Lock acquired - screen will stay on during broadcast');

                    // Re-acquire wake lock if it's released (e.g., user switches tabs)
                    wakeLock.addEventListener('release', () => {
                        console.log('Wake Lock released');
                    });
                } else {
                    console.log('Wake Lock API not supported on this device');
                }
            } catch (err) {
                console.error('Failed to acquire Wake Lock:', err);
            }
        }

        // Release wake lock
        async function releaseWakeLock() {
            if (wakeLock !== null) {
                try {
                    await wakeLock.release();
                    wakeLock = null;
                    console.log('Wake Lock released - screen can sleep now');
                } catch (err) {
                    console.error('Failed to release Wake Lock:', err);
                }
            }
        }

        function updateUI() {
            const btn = document.getElementById('toggleBtn');
            const statusText = document.getElementById('statusText');
            const statusDot = document.getElementById('statusDot');
            const testBtn = document.getElementById('testBtn');

            if (isStreaming) {
                btn.textContent = 'Stop Broadcasting';
                btn.className = 'stop-btn';
                statusText.textContent = 'Broadcasting';
                statusDot.className = 'status-dot broadcasting';
                testBtn.style.display = 'none';
            } else {
                btn.textContent = 'Start Broadcasting';
                btn.className = 'broadcast-btn';
                statusText.textContent = 'Ready to broadcast';
                statusDot.className = 'status-dot';
                testBtn.style.display = '';
            }
        }

        function updateListenerCount(count) {
            // Subtract 1 to exclude the guide from the count
            const listenerCount = Math.max(0, count - 1);
            const countElement = document.getElementById('listenerCount');
            const labelElement = document.querySelector('.counter-label');

            countElement.textContent = listenerCount;
            labelElement.textContent = listenerCount === 1 ? 'Listener' : 'Listeners';

            console.log('Listener count updated:', listenerCount);
        }

        function updateVisualizer() {
            if (!analyser || !isStreaming) return;

            const dataArray = new Uint8Array(analyser.frequencyBinCount);
            analyser.getByteTimeDomainData(dataArray);  // Changed to time domain for better responsiveness

            const bars = document.querySelectorAll('.bar');

            // Calculate average amplitude
            let sum = 0;
            for (let i = 0; i < dataArray.length; i++) {
                sum += Math.abs(dataArray[i] - 128);
            }
            const average = sum / dataArray.length;

            // Update bars with some variation
            bars.forEach((bar, i) => {
                const offset = Math.sin(Date.now() / 200 + i) * 10;
                const value = dataArray[i * 3] || 128;
                const amplitude = Math.abs(value - 128);
                const height = Math.max(5, (amplitude / 128) * 50 + offset + (average / 2));
                bar.style.height = height + 'px';
            });

            requestAnimationFrame(updateVisualizer);
        }

        async function startBroadcast() {
            try {
                stream = await navigator.mediaDevices.getUserMedia({
                    audio: {
                        echoCancellation: true,
                        noiseSuppression: true,
                        autoGainControl: true
                    }
                });

                console.log('Microphone stream obtained:', stream);
                console.log('Audio tracks:', stream.getAudioTracks());

                // Create AudioContext for visualizer only
                audioContext = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: 16000 });
                console.log('AudioContext created, state:', audioContext.state);

                // Resume AudioContext if suspended
                if (audioContext.state === 'suspended') {
                    await audioContext.resume();
                    console.log('AudioContext resumed, new state:', audioContext.state);
                }

                // Create analyser for visualizer
                analyser = audioContext.createAnalyser();
                analyser.fftSize = 256;
                analyser.smoothingTimeConstant = 0.3;

                const source = audioContext.createMediaStreamSource(stream);
                source.connect(analyser);
                // Don't connect analyser to destination - it's only for visualization

                console.log('Analyser connected, starting visualizer');

                // Create script processor for audio streaming
                // Using 1024 samples for stable, continuous audio
                scriptProcessor = audioContext.createScriptProcessor(1024, 1, 1);
                source.connect(scriptProcessor);

                // Create a gain node set to 0 to prevent feedback while keeping scriptProcessor active
                const silentGain = audioContext.createGain();
                silentGain.gain.value = 0; // Mute the output
                scriptProcessor.connect(silentGain);
                silentGain.connect(audioContext.destination);

                console.log('ScriptProcessor created (1024 samples = 64ms latency)');

                const protocol = location.protocol === 'https:' ? 'wss:' : 'ws:';
                ws = new WebSocket(protocol + '//' + location.host);
                ws.binaryType = 'arraybuffer';

                console.log('WebSocket connecting to:', protocol + '//' + location.host);

                let audioPacketCount = 0;
                let droppedPackets = 0;

                ws.onopen = async () => {
                    console.log('WebSocket connected!');

                    scriptProcessor.onaudioprocess = (e) => {
                        if (ws && ws.readyState === WebSocket.OPEN) {
                            const inputData = e.inputBuffer.getChannelData(0);

                            // Optimized PCM encoding - convert Float32 to Int16
                            const pcmData = new Int16Array(inputData.length);
                            for (let i = 0; i < inputData.length; i++) {
                                const s = Math.max(-1, Math.min(1, inputData[i]));
                                pcmData[i] = s < 0 ? s * 32768 : s * 32767;
                            }

                            // Send PCM data - ALWAYS send, no backpressure check
                            // (backpressure will be handled on server side)
                            ws.send(pcmData.buffer);

                            // Log every 100th packet
                            audioPacketCount++;
                            if (audioPacketCount % 100 === 0) {
                                console.log('Sent packet #' + audioPacketCount + ', buffer: ' + ws.bufferedAmount + ' bytes');
                            }
                        }
                    };

                    isStreaming = true;
                    updateUI();

                    // Request wake lock to keep screen on during broadcast
                    await requestWakeLock();

                    // Start visualizer after streaming is set to true
                    updateVisualizer();

                    console.log('Broadcasting started');
                };

                ws.onmessage = (event) => {
                    try {
                        const message = JSON.parse(event.data);
                        if (message.type === 'client-count') {
                            updateListenerCount(message.count);
                        } else if (message.type === 'broadcaster_taken') {
                            // Another guide is already broadcasting — switch to watch mode
                            enterWatchMode(message.listenerCount);
                        } else if (message.type === 'watch-status') {
                            // Periodic status update while in watch mode
                            updateWatchStatus(message.broadcasterActive, message.listenerCount);
                        } else if (message.type === 'broadcaster_ended') {
                            // The active broadcaster disconnected
                            showBroadcasterEnded();
                        }
                    } catch (e) {
                        // Not JSON — ignore
                    }
                };

                ws.onerror = () => {
                    document.getElementById('statusText').textContent = 'Connection error';
                    document.getElementById('statusDot').className = 'status-dot error';
                };

                ws.onclose = () => {
                    if (isStreaming) {
                        stopBroadcast();
                    }
                };
                
            } catch (err) {
                alert('Could not access microphone: ' + err.message);
            }
        }

        function stopBroadcast() {
            if (scriptProcessor) {
                scriptProcessor.disconnect();
                scriptProcessor = null;
            }
            if (ws) {
                ws.close();
                ws = null;
            }
            if (stream) {
                stream.getTracks().forEach(track => track.stop());
                stream = null;
            }
            if (audioContext) {
                audioContext.close();
                audioContext = null;
            }

            isStreaming = false;
            updateUI();

            // Release wake lock when stopping broadcast
            releaseWakeLock();

            const bars = document.querySelectorAll('.bar');
            bars.forEach(bar => bar.style.height = '5px');
        }

        function toggleBroadcast() {
            if (isStreaming) {
                stopBroadcast();
            } else {
                startBroadcast();
            }
        }

        // ── Watch Mode ────────────────────────────────────────────────────────

        // Called when the server rejects us as broadcaster (slot taken)
        function enterWatchMode(listenerCount) {
            isWatchMode = true;

            // Stop audio capture but keep the WebSocket open for status updates
            if (scriptProcessor) { scriptProcessor.disconnect(); scriptProcessor = null; }
            if (stream) { stream.getTracks().forEach(t => t.stop()); stream = null; }
            if (audioContext) { audioContext.close(); audioContext = null; }
            isStreaming = false;

            // Update listener counter with the count from the server
            const lc = Math.max(0, listenerCount || 0);
            document.getElementById('listenerCount').textContent = lc;
            document.querySelector('.counter-label').textContent = lc === 1 ? 'Listener' : 'Listeners';

            // Update status bar
            document.getElementById('statusDot').className = 'status-dot connected';
            document.getElementById('statusText').textContent = 'Watching broadcast';

            // Show watch banner, hide broadcast controls
            document.getElementById('watchBanner').style.display = 'flex';
            document.getElementById('broadcastEndedBanner').style.display = 'none';
            document.getElementById('toggleBtn').style.display = 'none';
            document.getElementById('testBtn').style.display = 'none';
            document.getElementById('visualizer').style.display = 'none';

            // Auto-open metrics panel so watcher can see live data
            if (!metricsOpen) toggleMetrics();
        }

        // Called when a watch-status update arrives from the server
        function updateWatchStatus(broadcasterActive, listenerCount) {
            if (!isWatchMode) return;
            const lc = Math.max(0, listenerCount || 0);
            document.getElementById('listenerCount').textContent = lc;
            document.querySelector('.counter-label').textContent = lc === 1 ? 'Listener' : 'Listeners';
            if (!broadcasterActive) showBroadcasterEnded();
        }

        // Called when the active broadcaster disconnects
        function showBroadcasterEnded() {
            isWatchMode = false;

            // Close the watch-mode WS connection cleanly
            if (ws) { try { ws.close(); } catch(e) {} ws = null; }

            // Stop metrics polling
            if (metricsInterval) { clearInterval(metricsInterval); metricsInterval = null; }
            if (metricsOpen) {
                metricsOpen = false;
                document.getElementById('metricsPanel').style.display = 'none';
                document.getElementById('metricsArrow').textContent = '▶';
            }

            // Update status bar
            document.getElementById('statusDot').className = 'status-dot';
            document.getElementById('statusText').textContent = 'Ready to broadcast';

            // Show "ended" banner and restore broadcast controls
            document.getElementById('watchBanner').style.display = 'none';
            document.getElementById('broadcastEndedBanner').style.display = 'flex';
            document.getElementById('toggleBtn').style.display = '';
            document.getElementById('toggleBtn').className = 'broadcast-btn';
            document.getElementById('toggleBtn').textContent = 'Start Broadcasting';
            document.getElementById('testBtn').style.display = '';
            document.getElementById('visualizer').style.display = '';
        }

        // Microphone test functionality - iOS/Safari compatible
        let testRecorder = null;
        let testChunks = [];
        let testAudioContext = null;
        let testRecordedBuffers = [];

        async function testMicrophone() {
            const testBtn = document.getElementById('testBtn');
            const testStatus = document.getElementById('testStatus');

            try {
                testBtn.disabled = true;
                testStatus.textContent = 'Accessing microphone...';

                // Get microphone access
                const testStream = await navigator.mediaDevices.getUserMedia({
                    audio: {
                        echoCancellation: true,
                        noiseSuppression: true,
                        autoGainControl: true
                    }
                });

                testStatus.textContent = 'Recording 3 seconds...';

                // Use Web Audio API for iOS compatibility (MediaRecorder not fully supported)
                testAudioContext = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: 16000 });

                // Resume if suspended
                if (testAudioContext.state === 'suspended') {
                    await testAudioContext.resume();
                }

                const source = testAudioContext.createMediaStreamSource(testStream);
                const processor = testAudioContext.createScriptProcessor(4096, 1, 1);

                testRecordedBuffers = [];

                processor.onaudioprocess = (e) => {
                    // Store audio data
                    const inputData = e.inputBuffer.getChannelData(0);
                    const buffer = new Float32Array(inputData.length);
                    buffer.set(inputData);
                    testRecordedBuffers.push(buffer);
                };

                source.connect(processor);
                processor.connect(testAudioContext.destination);

                // Record for 3 seconds
                setTimeout(() => {
                    processor.disconnect();
                    source.disconnect();
                    testStream.getTracks().forEach(track => track.stop());

                    // Play back the recorded audio
                    playbackRecording();
                }, 3000);

            } catch (err) {
                testStatus.textContent = 'Error: ' + err.message;
                testBtn.disabled = false;
                console.error('Microphone test error:', err);
            }
        }

        function playbackRecording() {
            const testBtn = document.getElementById('testBtn');
            const testStatus = document.getElementById('testStatus');

            try {
                testStatus.textContent = 'Playing back...';

                if (testRecordedBuffers.length === 0) {
                    testStatus.textContent = 'No audio recorded';
                    testBtn.disabled = false;
                    return;
                }

                // Combine all buffers
                const totalLength = testRecordedBuffers.reduce((acc, buf) => acc + buf.length, 0);
                const combinedBuffer = new Float32Array(totalLength);
                let offset = 0;
                for (const buffer of testRecordedBuffers) {
                    combinedBuffer.set(buffer, offset);
                    offset += buffer.length;
                }

                // Create audio buffer for playback
                const audioBuffer = testAudioContext.createBuffer(1, combinedBuffer.length, testAudioContext.sampleRate);
                audioBuffer.getChannelData(0).set(combinedBuffer);

                // Play it back
                const source = testAudioContext.createBufferSource();
                source.buffer = audioBuffer;
                source.connect(testAudioContext.destination);

                source.onended = () => {
                    testStatus.textContent = 'Test complete! ✓';
                    testBtn.disabled = false;
                    testAudioContext.close();
                    testAudioContext = null;
                    testRecordedBuffers = [];

                    setTimeout(() => {
                        testStatus.textContent = '';
                    }, 3000);
                };

                source.start(0);

            } catch (err) {
                testStatus.textContent = 'Playback error: ' + err.message;
                testBtn.disabled = false;
                console.error('Playback error:', err);
            }
        }

        // ── Performance Metrics ───────────────────────────────────────────────
        let metricsOpen = false;
        let metricsInterval = null;

        function toggleMetrics() {
            metricsOpen = !metricsOpen;
            document.getElementById('metricsPanel').style.display = metricsOpen ? 'block' : 'none';
            document.getElementById('metricsArrow').textContent = metricsOpen ? '▼' : '▶';
            if (metricsOpen) {
                fetchMetrics();
                metricsInterval = setInterval(fetchMetrics, 5000);
            } else {
                clearInterval(metricsInterval);
                metricsInterval = null;
            }
        }

        function parsePct(str) {
            return parseFloat(str) || 0;
        }

        function colorDot(id, value, warnAt, redAt) {
            const dot = document.getElementById(id);
            if (value >= redAt)       dot.style.background = '#F44336'; // red
            else if (value >= warnAt) dot.style.background = '#FF9800'; // yellow
            else                      dot.style.background = '#4CAF50'; // green
        }

        async function fetchMetrics() {
            try {
                const res = await fetch('/health');
                const d = await res.json();

                // CPU
                const cpu = parsePct(d.system?.cpuLoad);
                document.getElementById('metricCpu').textContent = d.system?.cpuLoad || '—';
                colorDot('dotCpu', cpu, 50, 80);

                // RAM free (higher = better, so invert thresholds)
                const ramFree = parsePct(d.system?.memoryFree); // e.g. "179 MB" → 179
                document.getElementById('metricRam').textContent = d.system?.memoryFree || '—';
                // green > 150 MB, yellow 80–150 MB, red < 80 MB
                const dotRam = document.getElementById('dotRam');
                if (ramFree < 80)       dotRam.style.background = '#F44336';
                else if (ramFree < 150) dotRam.style.background = '#FF9800';
                else                    dotRam.style.background = '#4CAF50';

                // Throughput (just display; green if broadcasting, grey if not)
                const tp = d.broadcast?.throughput || '—';
                document.getElementById('metricThroughput').textContent = tp;
                document.getElementById('dotThroughput').style.background =
                    d.broadcast?.live ? '#4CAF50' : '#EFEFEF';

                // Skip rate
                const skip = parsePct(d.performance?.skipRate);
                document.getElementById('metricSkip').textContent = d.performance?.skipRate || '0.00%';
                colorDot('dotSkip', skip, 1, 5);

                // Peak clients
                document.getElementById('metricClients').textContent = d.broadcast?.peakClients ?? '—';
                document.getElementById('dotClients').style.background = '#4CAF50';

                // Node heap
                document.getElementById('metricHeap').textContent = d.system?.nodeHeap || '—';
                const heap = parsePct(d.system?.nodeHeap); // e.g. "28.4 MB" → 28.4
                colorDot('dotHeap', heap, 80, 150);

                document.getElementById('metricsUpdated').textContent =
                    'Updated ' + new Date().toLocaleTimeString();
            } catch (err) {
                document.getElementById('metricsUpdated').textContent = 'Error fetching metrics';
                console.error('Metrics fetch failed:', err);
            }
        }
    </script>
</body>
</html>
