<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EF Tour Audio - Listen</title>
    <link rel="icon" type="image/png" href="EF-Logos_EF Logo Pink.png">
    <style>
        /* Full-bleed gradient on html prevents white overscroll flash */
        html { background: #00243C; }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'EF Circular', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(180deg, #003C64 0%, #00243C 100%);
            min-height: 100dvh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 28px 24px;
        }
        .page {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            max-width: 420px;
        }
        .logo { height: 60px; margin-bottom: 24px; filter: drop-shadow(0 4px 16px rgba(0,0,0,0.3)); }
        .headline-group { text-align: center; margin-bottom: 20px; }
        h1 { color: #fff; font-size: 34px; font-weight: 700; letter-spacing: -0.5px; margin-bottom: 6px; }
        .subtitle { color: rgba(255,255,255,0.6); font-size: 17px; font-weight: 400; margin-bottom: 10px; }
        .traveler-id {
            display: inline-block;
            background: rgba(255,255,255,0.12); color: rgba(255,255,255,0.7);
            font-size: 12px; font-weight: 600; padding: 4px 12px; border-radius: 20px;
        }
        /* Status row */
        .status-row { display: flex; align-items: center; gap: 8px; margin-bottom: 14px; }
        .status-dot { width: 8px; height: 8px; border-radius: 50%; background: rgba(255,255,255,0.3); flex-shrink: 0; }
        .status-dot.connected { background: #FF329B; animation: dotPulse 2s ease-in-out infinite; }
        .status-dot.connecting { background: #FF329B; opacity: 0.5; }
        .status-dot.error { background: rgba(255,255,255,0.4); }
        @keyframes dotPulse {
            0%, 100% { opacity: 1; box-shadow: 0 0 0 0 rgba(255,50,155,0.4); }
            50%       { opacity: 0.7; box-shadow: 0 0 0 6px rgba(255,50,155,0); }
        }
        .status-text { color: #fff; font-size: 15px; font-weight: 500; }
        /* Waveform — CSS-animated, shown when receiving audio */
        .waveform { display: none; align-items: flex-end; gap: 4px; height: 28px; margin-bottom: 20px; }
        .wave-bar {
            width: 4px; border-radius: 2px; background: rgba(255,50,155,0.5);
            transform-origin: 50% 100%;
            animation: waveBar 1.1s ease-in-out infinite alternate;
        }
        .wave-bar:nth-child(1) { height:  9px; animation-delay: -0.00s; }
        .wave-bar:nth-child(2) { height: 16px; animation-delay: -0.15s; }
        .wave-bar:nth-child(3) { height: 23px; animation-delay: -0.30s; }
        .wave-bar:nth-child(4) { height: 27px; animation-delay: -0.45s; }
        .wave-bar:nth-child(5) { height: 28px; animation-delay: -0.55s; }
        .wave-bar:nth-child(6) { height: 27px; animation-delay: -0.45s; }
        .wave-bar:nth-child(7) { height: 23px; animation-delay: -0.30s; }
        .wave-bar:nth-child(8) { height: 16px; animation-delay: -0.15s; }
        .wave-bar:nth-child(9) { height:  9px; animation-delay: -0.00s; }
        @keyframes waveBar {
            from { transform: scaleY(0.3); opacity: 0.3; }
            to   { transform: scaleY(1);   opacity: 0.8; }
        }
        /* Buttons */
        .btn-group { width: 100%; margin-bottom: 28px; }
        .btn-primary {
            width: 100%; padding: 16px; font-size: 17px; font-weight: 700;
            font-family: inherit; border: none; border-radius: 50px; cursor: pointer;
            background: #FF329B; color: #fff; transition: all 0.2s ease; margin-bottom: 14px;
        }
        .btn-primary:hover { background: #e0237f; transform: translateY(-1px); box-shadow: 0 8px 24px rgba(255,50,155,0.35); }
        .btn-primary:active { transform: translateY(0); box-shadow: none; }
        .btn-secondary-row { display: flex; gap: 12px; }
        .btn-ghost {
            flex: 1; padding: 13px; font-size: 14px; font-weight: 600; font-family: inherit;
            border: 1.5px solid rgba(255,255,255,0.35); border-radius: 50px;
            cursor: pointer; background: transparent; color: #fff; transition: all 0.2s ease;
            display: flex; align-items: center; justify-content: center; gap: 6px;
        }
        .btn-ghost:hover { background: rgba(255,255,255,0.1); }
        .btn-ghost:disabled { opacity: 0.4; cursor: not-allowed; }
        .test-status { text-align: center; margin-top: 12px; font-size: 14px; color: rgba(255,255,255,0.7); min-height: 20px; }
        /* Volume */
        .volume-control { width: 100%; margin-bottom: 24px; }
        .volume-control label {
            display: block; margin-bottom: 12px; color: rgba(255,255,255,0.9);
            font-weight: 700; font-size: 11px; letter-spacing: 1.5px;
            text-transform: uppercase; text-align: center;
        }
        input[type="range"] { width: 100%; height: 6px; border-radius: 3px; background: rgba(255,255,255,0.2); outline: none; -webkit-appearance: none; }
        input[type="range"]::-webkit-slider-runnable-track {
            width: 100%; height: 6px; border-radius: 3px;
            background: linear-gradient(to right, #FF329B 0%, #FF329B var(--value, 80%), rgba(255,255,255,0.2) var(--value, 80%), rgba(255,255,255,0.2) 100%);
        }
        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none; appearance: none; width: 22px; height: 22px;
            border-radius: 50%; background: #FF329B; cursor: pointer;
            box-shadow: 0 2px 8px rgba(255,50,155,0.4); margin-top: -8px;
        }
        input[type="range"]::-moz-range-track { width: 100%; height: 6px; border-radius: 3px; background: rgba(255,255,255,0.2); }
        input[type="range"]::-moz-range-progress { height: 6px; border-radius: 3px; background: #FF329B; }
        input[type="range"]::-moz-range-thumb {
            width: 22px; height: 22px; border-radius: 50%; background: #FF329B;
            cursor: pointer; border: none; box-shadow: 0 2px 8px rgba(255,50,155,0.4);
        }
        .volume-value { text-align: center; margin-top: 10px; color: #FF329B; font-weight: 700; font-size: 15px; }
        /* iPhone footnote — always visible */
        .ios-note { width: 100%; text-align: center; padding-top: 16px; }
        .ios-note hr { border: none; border-top: 1px solid rgba(255,255,255,0.15); margin-bottom: 12px; }
        .ios-note p { font-size: 12px; color: rgba(255,255,255,0.5); line-height: 1.6; }
        .ios-note strong { color: rgba(255,255,255,0.7); }
        /* Entrance animations — staggered fade + slide up */
        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(16px); }
            to   { opacity: 1; transform: translateY(0); }
        }
        .anim-0 { animation: fadeUp 0.5s ease both; }
        .anim-1 { animation: fadeUp 0.5s ease both; animation-delay:  80ms; }
        .anim-2 { animation: fadeUp 0.5s ease both; animation-delay: 160ms; }
        .anim-3 { animation: fadeUp 0.5s ease both; animation-delay: 240ms; }
        .anim-4 { animation: fadeUp 0.5s ease both; animation-delay: 320ms; }
        .anim-5 { animation: fadeUp 0.5s ease both; animation-delay: 400ms; }

        /* ── Lock Screen ──────────────────────────────────────────────────── */
        #lockOverlay {
            position: fixed;
            inset: 0;
            z-index: 9999;
            background: linear-gradient(160deg, #0088CC 0%, #003C64 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 40px 24px;
            touch-action: none;
            -webkit-user-select: none;
            user-select: none;
            cursor: pointer;
        }
        .lock-logo-lg {
            height: 120px;
            margin-bottom: 52px;
            pointer-events: none;
            filter: drop-shadow(0 4px 24px rgba(0,0,0,0.35));
        }
        .lock-wave {
            display: flex;
            align-items: flex-end;
            gap: 5px;
            height: 56px;
            margin-bottom: 14px;
        }
        .lock-wave-bar {
            width: 6px;
            border-radius: 3px;
            background: rgba(255,255,255,0.85);
            transform-origin: 50% 100%;
            animation: lockBar 1.1s ease-in-out infinite alternate;
        }
        /* Arch heights + staggered phase via negative delays */
        .lock-wave-bar:nth-child(1) { height: 18px; animation-delay: -0.00s; }
        .lock-wave-bar:nth-child(2) { height: 30px; animation-delay: -0.15s; }
        .lock-wave-bar:nth-child(3) { height: 42px; animation-delay: -0.30s; }
        .lock-wave-bar:nth-child(4) { height: 52px; animation-delay: -0.45s; }
        .lock-wave-bar:nth-child(5) { height: 56px; animation-delay: -0.55s; }
        .lock-wave-bar:nth-child(6) { height: 52px; animation-delay: -0.45s; }
        .lock-wave-bar:nth-child(7) { height: 42px; animation-delay: -0.30s; }
        .lock-wave-bar:nth-child(8) { height: 30px; animation-delay: -0.15s; }
        .lock-wave-bar:nth-child(9) { height: 18px; animation-delay: -0.00s; }
        @keyframes lockBar {
            from { transform: scaleY(0.3); opacity: 0.45; }
            to   { transform: scaleY(1);   opacity: 1;    }
        }
        .lock-wave.paused .lock-wave-bar {
            animation-play-state: paused;
            opacity: 0.2;
            transform: scaleY(0.3);
            transition: opacity 0.4s, transform 0.4s;
        }
        .lock-audio-label {
            color: rgba(255,255,255,0.9);
            font-size: 17px;
            font-weight: 600;
            letter-spacing: 0.2px;
            margin-bottom: 52px;
        }
        .lock-unlock-label {
            color: rgba(255,255,255,0.5);
            font-size: 12px;
            font-weight: 600;
            letter-spacing: 1px;
            text-transform: uppercase;
            margin-bottom: 18px;
        }
        .lock-dots {
            display: flex;
            gap: 20px;
            margin-bottom: 18px;
        }
        .lock-dot {
            width: 16px;
            height: 16px;
            border-radius: 50%;
            border: 2px solid rgba(255,255,255,0.55);
            background: transparent;
            transition: background 0.15s, border-color 0.15s, transform 0.15s, box-shadow 0.15s;
        }
        .lock-dot.active {
            background: #FFFFFF;
            border-color: #FFFFFF;
            transform: scale(1.3);
            box-shadow: 0 0 14px rgba(255,255,255,0.55);
        }
        .lock-hint {
            color: rgba(255,255,255,0.5);
            font-size: 13px;
            min-height: 20px;
        }
    </style>
</head>
<body>
    <div class="page">
        <img src="EF-Logos_EF Logo Pink.png" alt="EF Tours" class="logo anim-0">

        <div class="headline-group anim-1">
            <h1>Tour Audio</h1>
            <p class="subtitle">Listen to your guide</p>
            <div class="traveler-id" id="travelerId" style="display:none;">#<span id="travelerNumber"></span></div>
        </div>

        <div class="status-row anim-2">
            <div class="status-dot" id="statusDot"></div>
            <span class="status-text" id="statusText">Not connected</span>
        </div>

        <!-- Waveform — CSS-animated, appears when audio is received -->
        <div class="waveform" id="waveform">
            <div class="wave-bar"></div>
            <div class="wave-bar"></div>
            <div class="wave-bar"></div>
            <div class="wave-bar"></div>
            <div class="wave-bar"></div>
            <div class="wave-bar"></div>
            <div class="wave-bar"></div>
            <div class="wave-bar"></div>
            <div class="wave-bar"></div>
        </div>

        <div class="btn-group anim-3">
            <button id="toggleBtn" class="btn-primary" onclick="toggleListening()">Start Listening</button>
            <div class="btn-secondary-row">
                <button id="lockBtn" class="btn-ghost" onclick="enterLockMode()" style="display:none;">
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="11" x="3" y="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
                    Lock Screen
                </button>
                <button id="testBtn" class="btn-ghost" onclick="testAudio()">
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4.702a.705.705 0 0 0-1.203-.498L6.413 7.587A1.4 1.4 0 0 1 5.416 8H3a1 1 0 0 0-1 1v6a1 1 0 0 0 1 1h2.416a1.4 1.4 0 0 1 .997.413l3.383 3.384A.705.705 0 0 0 11 19.298z"/><path d="M16 9a5 5 0 0 1 0 6"/><path d="M19.364 18.364a9 9 0 0 0 0-12.728"/></svg>
                    Test Audio
                </button>
            </div>
            <div class="test-status" id="testStatus"></div>
        </div>

        <div class="volume-control anim-4">
            <label for="volumeSlider">VOLUME</label>
            <input type="range" id="volumeSlider" min="0" max="100" value="80" oninput="setVolume(this.value)">
            <div class="volume-value" id="volumeValue">80%</div>
        </div>

        <footer class="ios-note anim-5">
            <hr>
            <p>iPhone users: check that your silent switch is <strong>OFF</strong>, or use headphones.</p>
        </footer>
    </div>

    <!-- ── Lock Screen Overlay ─────────────────────────────────────── -->
    <div id="lockOverlay" style="display:none;">
        <img src="EF-Logos_EF Logo Pink.png" alt="EF Tours" class="lock-logo-lg">

        <div class="lock-wave" id="lockWave">
            <div class="lock-wave-bar"></div>
            <div class="lock-wave-bar"></div>
            <div class="lock-wave-bar"></div>
            <div class="lock-wave-bar"></div>
            <div class="lock-wave-bar"></div>
            <div class="lock-wave-bar"></div>
            <div class="lock-wave-bar"></div>
            <div class="lock-wave-bar"></div>
            <div class="lock-wave-bar"></div>
        </div>
        <div class="lock-audio-label" id="lockAudioLabel">🎧 Audio playing</div>

        <div class="lock-unlock-label">Tap 3× to unlock</div>
        <div class="lock-dots">
            <div class="lock-dot" id="lockDot1"></div>
            <div class="lock-dot" id="lockDot2"></div>
            <div class="lock-dot" id="lockDot3"></div>
        </div>
        <div class="lock-hint" id="lockHint"></div>
    </div>

    <script>
        let ws = null;
        let isListening = false;
        let audioContext = null;
        let gainNode = null;
        let nextPlayTime = 0;
        let wakeLock = null;

        // Lock screen state
        let isLocked = false;
        let lockTapCount = 0;
        let lockTapTimer = null;
        let lockTapFlashTimer = null;

        function updateStatus(state, text) {
            document.getElementById('statusDot').className = 'status-dot ' + state;
            document.getElementById('statusText').textContent = text;
        }

        function updateButton() {
            const btn = document.getElementById('toggleBtn');
            const lockBtn = document.getElementById('lockBtn');
            btn.className = 'btn-primary';
            if (isListening) {
                btn.textContent = 'Stop Listening';
                if (lockBtn) lockBtn.style.display = '';
            } else {
                btn.textContent = 'Start Listening';
                if (lockBtn) lockBtn.style.display = 'none';
            }
        }

        function setVolume(value) {
            if (gainNode) {
                gainNode.gain.value = value / 100;
            }
            document.getElementById('volumeValue').textContent = value + '%';

            // Update slider fill color (for webkit browsers)
            const slider = document.getElementById('volumeSlider');
            if (slider) {
                slider.style.setProperty('--value', value + '%');
            }
        }

        // Initialize slider fill on page load
        window.addEventListener('DOMContentLoaded', () => {
            setVolume(80); // Set initial volume
        });

        // Request wake lock to prevent screen from sleeping
        async function requestWakeLock() {
            try {
                if ('wakeLock' in navigator) {
                    wakeLock = await navigator.wakeLock.request('screen');
                    console.log('Wake Lock acquired - screen will stay on');

                    // Re-acquire wake lock if it's released (e.g., user switches tabs)
                    wakeLock.addEventListener('release', () => {
                        console.log('Wake Lock released');
                    });
                } else {
                    console.log('Wake Lock API not supported on this device');
                }
            } catch (err) {
                console.error('Failed to acquire Wake Lock:', err);
            }
        }

        // Release wake lock
        async function releaseWakeLock() {
            if (wakeLock !== null) {
                try {
                    await wakeLock.release();
                    wakeLock = null;
                    console.log('Wake Lock released manually');
                } catch (err) {
                    console.error('Failed to release Wake Lock:', err);
                }
            }
        }

        // Waveform is CSS-animated; no JS driving needed
        function updateMiniVisualizer(audioData) { /* no-op */ }

        async function startListening() {
            try {
                updateStatus('connecting', 'Connecting...');

                // Create AudioContext in response to user interaction (required for iOS)
                audioContext = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: 16000 });
                console.log('AudioContext created, state:', audioContext.state);

                // CRITICAL for iOS: Resume AudioContext immediately after user interaction
                if (audioContext.state === 'suspended') {
                    console.log('Attempting to resume AudioContext for iOS...');
                    await audioContext.resume();
                    console.log('AudioContext resumed, new state:', audioContext.state);
                }

                // Play a silent sound to "unlock" audio on iOS
                const silentBuffer = audioContext.createBuffer(1, 1, audioContext.sampleRate);
                const silentSource = audioContext.createBufferSource();
                silentSource.buffer = silentBuffer;
                silentSource.connect(audioContext.destination);
                silentSource.start(0);
                console.log('Silent sound played to unlock iOS audio');

                // Detect if device might be in silent mode (iOS-specific check)
                checkSilentMode();

                // Request wake lock to keep screen on during audio playback
                await requestWakeLock();

                gainNode = audioContext.createGain();
                gainNode.connect(audioContext.destination);
                setVolume(document.getElementById('volumeSlider').value);

                nextPlayTime = audioContext.currentTime;

                const protocol = location.protocol === 'https:' ? 'wss:' : 'ws:';
                ws = new WebSocket(protocol + '//' + location.host);
                ws.binaryType = 'arraybuffer';

                console.log('WebSocket connecting to:', protocol + '//' + location.host);

                let receivedPacketCount = 0;

                ws.onopen = () => {
                    isListening = true;
                    updateStatus('connected', 'Connected - Listening');
                    updateButton();
                    updateLockWave();
                    console.log('WebSocket connected, waiting for audio...');
                };

                ws.onmessage = (event) => {
                    try {
                        // Check if it's a text message (client count update or client ID)
                        if (typeof event.data === 'string') {
                            const message = JSON.parse(event.data);
                            if (message.type === 'client-count') {
                                // Listener page doesn't display count, just ignore
                                return;
                            }
                            if (message.type === 'client-id') {
                                document.getElementById('travelerNumber').textContent = message.id;
                                document.getElementById('travelerId').style.display = 'inline-block';
                                return;
                            }
                        }

                        // It's binary audio data (PCM)
                        receivedPacketCount++;

                        // Show waveform on first packet
                        if (receivedPacketCount === 1) {
                            document.getElementById('waveform').style.display = 'flex';
                            console.log('First audio packet received - showing waveform');
                        }

                        // Log every 50th packet
                        if (receivedPacketCount % 50 === 0) {
                            console.log('Received packet #' + receivedPacketCount);
                        }

                        // Convert Int16Array back to Float32Array
                        const pcmData = new Int16Array(event.data);
                        const floatData = new Float32Array(pcmData.length);
                        for (let i = 0; i < pcmData.length; i++) {
                            floatData[i] = pcmData[i] / 32768;
                        }

                        // Update mini visualizer with audio data
                        updateMiniVisualizer(floatData);

                        // Create audio buffer
                        const audioBuffer = audioContext.createBuffer(1, floatData.length, audioContext.sampleRate);
                        audioBuffer.getChannelData(0).set(floatData);

                        // Create and schedule source
                        const source = audioContext.createBufferSource();
                        source.buffer = audioBuffer;
                        source.connect(gainNode);

                        // Schedule for seamless playback with small buffer
                        if (receivedPacketCount === 1) {
                            // First packet: add 100ms buffer to prevent underruns
                            nextPlayTime = audioContext.currentTime + 0.1;
                            console.log('First audio packet - starting with 100ms buffer');
                        }

                        // Always schedule at nextPlayTime (don't skip ahead)
                        source.start(nextPlayTime);
                        nextPlayTime = nextPlayTime + audioBuffer.duration;

                        // Check for drift: if we're falling too far behind, reset
                        const drift = nextPlayTime - audioContext.currentTime;
                        if (drift > 1.0) {  // If more than 1 second ahead, reset
                            console.log('Buffer overflow detected (' + Math.round(drift * 1000) + 'ms ahead), resetting');
                            nextPlayTime = audioContext.currentTime + 0.1;
                        } else if (drift < 0) {  // If we're behind current time, catch up
                            console.log('Buffer underrun detected, resetting');
                            nextPlayTime = audioContext.currentTime + 0.05;  // Small buffer
                        }

                    } catch (e) {
                        console.error('Audio playback error:', e);
                    }
                };
                
                ws.onclose = () => {
                    if (isListening) {
                        updateStatus('error', 'Disconnected - Tap to reconnect');
                        isListening = false;
                        updateButton();
                        updateLockWave();
                    }
                };

                ws.onerror = () => {
                    updateStatus('error', 'Connection error');
                    isListening = false;
                    updateButton();
                    updateLockWave();
                };
                
            } catch (err) {
                updateStatus('error', 'Error: ' + err.message);
                console.error(err);
            }
        }

        function stopListening() {
            // Exit lock mode first if active so the UI restores correctly
            if (isLocked) exitLockMode();

            if (ws) {
                ws.close();
                ws = null;
            }
            if (audioContext) {
                audioContext.close();
                audioContext = null;
            }

            // Release wake lock when stopping
            releaseWakeLock();

            // Hide waveform
            document.getElementById('waveform').style.display = 'none';

            gainNode = null;
            isListening = false;
            updateStatus('', 'Not connected');
            updateButton();
        }

        function toggleListening() {
            if (isListening) {
                stopListening();
            } else {
                startListening();
            }
        }

        // Test audio functionality - plays a pleasant chime (iOS/Safari compatible)
        async function testAudio() {
            const testBtn = document.getElementById('testBtn');
            const testStatus = document.getElementById('testStatus');

            try {
                testBtn.disabled = true;
                testStatus.textContent = 'Playing test chime...';

                // Create AudioContext if not exists
                const testAudioContext = new (window.AudioContext || window.webkitAudioContext)();

                console.log('Test AudioContext state:', testAudioContext.state);

                // Resume if suspended (required for iOS/Safari)
                if (testAudioContext.state === 'suspended') {
                    await testAudioContext.resume();
                    console.log('Test AudioContext resumed:', testAudioContext.state);
                }

                // Create a pleasant three-tone chime (C-E-G major chord arpeggio)
                const notes = [523.25, 659.25, 783.99]; // C5, E5, G5
                const volume = document.getElementById('volumeSlider').value / 100;

                // Play all notes
                let playedNotes = 0;
                for (let i = 0; i < notes.length; i++) {
                    await playTone(testAudioContext, notes[i], 0.3, volume, i * 0.25);
                    playedNotes++;
                }

                console.log('Played', playedNotes, 'notes');

                // Wait for all notes to finish
                setTimeout(() => {
                    testStatus.textContent = 'Audio test complete! ✓';
                    testBtn.disabled = false;

                    // Don't close context immediately on iOS - causes issues
                    setTimeout(() => {
                        testAudioContext.close();
                    }, 500);

                    setTimeout(() => {
                        testStatus.textContent = '';
                    }, 3000);
                }, 1500);

            } catch (err) {
                testStatus.textContent = 'Error: ' + err.message;
                testBtn.disabled = false;
                console.error('Audio test error:', err);
            }
        }

        function playTone(context, frequency, duration, volume, delay) {
            return new Promise((resolve) => {
                setTimeout(() => {
                    try {
                        const oscillator = context.createOscillator();
                        const gainNode = context.createGain();

                        oscillator.connect(gainNode);
                        gainNode.connect(context.destination);

                        oscillator.frequency.value = frequency;
                        oscillator.type = 'sine';

                        // Envelope for smooth sound
                        const now = context.currentTime;
                        gainNode.gain.setValueAtTime(0, now);
                        gainNode.gain.linearRampToValueAtTime(volume * 0.3, now + 0.05);
                        gainNode.gain.exponentialRampToValueAtTime(0.01, now + duration);

                        oscillator.start(now);
                        oscillator.stop(now + duration);

                        oscillator.onended = () => {
                            console.log('Tone ended:', frequency);
                            resolve();
                        };
                    } catch (err) {
                        console.error('Error playing tone:', err);
                        resolve();
                    }
                }, delay * 1000);
            });
        }

        // iOS note is always visible in the footer — nothing to do
        function checkSilentMode() { /* note is always shown */ }

        // ── Lock Screen ───────────────────────────────────────────────────────

        function enterLockMode() {
            isLocked = true;
            lockTapCount = 0;
            resetLockDots();
            document.getElementById('lockHint').textContent = '';
            document.getElementById('lockOverlay').style.display = 'flex';
            updateLockWave();

            // Fullscreen: hides browser chrome on Android (silently fails on iOS)
            const el = document.documentElement;
            try {
                if (el.requestFullscreen)             el.requestFullscreen();
                else if (el.webkitRequestFullscreen)  el.webkitRequestFullscreen();
            } catch(e) {}

            // Trap the back button so it can't navigate away while locked
            history.pushState({ locked: true }, '');
        }

        function exitLockMode() {
            isLocked = false;
            lockTapCount = 0;
            resetLockDots();
            clearTimeout(lockTapTimer);
            clearTimeout(lockTapFlashTimer);
            document.getElementById('lockOverlay').style.display = 'none';
            document.getElementById('lockHint').textContent = '';

            // Exit fullscreen if active
            try {
                if (document.exitFullscreen)              document.exitFullscreen();
                else if (document.webkitExitFullscreen)   document.webkitExitFullscreen();
            } catch(e) {}
        }

        function handleLockTap() {
            if (!isLocked) return;
            clearTimeout(lockTapTimer);

            lockTapCount++;
            if (lockTapCount <= 3) {
                document.getElementById('lockDot' + lockTapCount).classList.add('active');
            }

            const hint = document.getElementById('lockHint');
            if (lockTapCount >= 3) {
                hint.textContent = '✓ Unlocked';
                setTimeout(exitLockMode, 220);
            } else {
                hint.textContent = lockTapCount + ' of 3…';
                // Reset if no further tap within 2 seconds
                lockTapTimer = setTimeout(() => {
                    lockTapCount = 0;
                    resetLockDots();
                    hint.textContent = '';
                }, 2000);
            }
        }

        function resetLockDots() {
            [1, 2, 3].forEach(n =>
                document.getElementById('lockDot' + n).classList.remove('active'));
        }

        // Reflect audio connection state in the lock screen wave animation
        function updateLockWave() {
            const wave  = document.getElementById('lockWave');
            const label = document.getElementById('lockAudioLabel');
            if (!wave || !label) return;
            if (isListening) {
                wave.classList.remove('paused');
                label.textContent = '🎧 Audio playing';
            } else {
                wave.classList.add('paused');
                label.textContent = '⏸ Not connected';
            }
        }

        // Prevent swipe-scroll gestures from escaping the lock overlay on iOS
        document.getElementById('lockOverlay').addEventListener(
            'touchmove', e => e.preventDefault(), { passive: false });

        // Wire up tap handler via both touch and click for cross-device support
        document.getElementById('lockOverlay').addEventListener('click', handleLockTap);

        // Intercept hardware back button while locked
        window.addEventListener('popstate', () => {
            if (isLocked) {
                history.pushState({ locked: true }, ''); // re-trap
                const hint = document.getElementById('lockHint');
                hint.textContent = 'Tap 3× to exit';
                clearTimeout(lockTapFlashTimer);
                lockTapFlashTimer = setTimeout(() => { hint.textContent = ''; }, 2500);
            }
        });

        // ── Initialize ────────────────────────────────────────────────────────

        // Initialize volume
        setVolume(80);
    </script>
</body>
</html>
