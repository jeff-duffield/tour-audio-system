name: Android apps

on:
  workflow_dispatch:
  push:
    paths:
      - "android/**"
      - ".github/workflows/android-apps.yml"

jobs:
  apk:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      # v3 fails because it still installs the removed Android "tools" package.
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install SDK packages
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Download English caption model
        run: |
          set -euo pipefail
          dest="android/guide/src/main/assets/sherpa-onnx-streaming-zipformer-en-2023-06-26"
          mkdir -p "$dest"
          curl -fsSL -o /tmp/caption-model.tar.bz2 \
            https://github.com/k2-fsa/sherpa-onnx/releases/download/asr-models/sherpa-onnx-streaming-zipformer-en-2023-06-26.tar.bz2
          tar -xjf /tmp/caption-model.tar.bz2 -C android/guide/src/main/assets
          test -f "$dest/encoder-epoch-99-avg-1-chunk-16-left-128.int8.onnx"
          test -f "$dest/decoder-epoch-99-avg-1-chunk-16-left-128.onnx"
          test -f "$dest/joiner-epoch-99-avg-1-chunk-16-left-128.onnx"
          test -f "$dest/tokens.txt"
          find "$dest" -type f \
            ! -name 'encoder-epoch-99-avg-1-chunk-16-left-128.int8.onnx' \
            ! -name 'decoder-epoch-99-avg-1-chunk-16-left-128.onnx' \
            ! -name 'joiner-epoch-99-avg-1-chunk-16-left-128.onnx' \
            ! -name 'tokens.txt' -delete

      - name: Build debug APKs
        working-directory: android
        run: chmod +x ./gradlew && ./gradlew :traveler:assembleDebug :guide:assembleDebug --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: tour-audio-traveler
          path: android/traveler/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: tour-audio-guide
          path: android/guide/build/outputs/apk/debug/*.apk
          if-no-files-found: error
